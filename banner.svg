<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aary Jadhav banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- © Aary Jadhav -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b14"><animate attributeName="stop-color" values="#0b0b14;#14102b;#0b0b14" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#1b1140"><animate attributeName="stop-color" values="#1b1140;#0b1a2e;#1b1140" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="38"/></filter>
    <style>
      .name{font:800 76px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-2px;fill:url(#txt);opacity:0;animation:rise 1.2s .2s ease-out forwards}
      .sub{font:500 22px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#a1a1c5;letter-spacing:6px;opacity:0;animation:rise 1.2s .7s ease-out forwards}
      .tag{font:600 15px 'Courier New',monospace;fill:#8b8bb5;opacity:0;animation:rise 1.2s 1.1s ease-out forwards}
      @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    </style>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <!-- glowing orbs -->
  <circle cx="220" cy="120" r="110" fill="#7c3aed" opacity=".55" filter="url(#blur)">
    <animate attributeName="cy" values="120;200;120" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="220;300;220" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="220" r="120" fill="#06b6d4" opacity=".4" filter="url(#blur)">
    <animate attributeName="cy" values="220;120;220" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="980;880;980" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="60" r="80" fill="#ec4899" opacity=".25" filter="url(#blur)">
    <animate attributeName="cx" values="620;760;620" dur="14s" repeatCount="indefinite"/>
  </circle>
  <!-- floating dots -->
  <g fill="#ffffff">
    <circle cx="140" cy="260" r="2"><animate attributeName="cy" values="260;40;260" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="290" r="1.6"><animate attributeName="cy" values="290;30;290" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="280" r="2.2"><animate attributeName="cy" values="280;20;280" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="270" r="1.8"><animate attributeName="cy" values="270;50;270" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="300" r="1.4"><animate attributeName="cy" values="300;60;300" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="6s" repeatCount="indefinite"/></circle>
  </g>
  <text x="600" y="150" text-anchor="middle" class="name">Aary Jadhav</text>
  <text x="600" y="198" text-anchor="middle" class="sub">DATA · DESIGN · CODE</text>
  <text x="600" y="238" text-anchor="middle" class="tag">&gt; turning messy problems into clean products_</text>
  <rect x="300" y="268" width="600" height="2" fill="url(#line)">
    <animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>