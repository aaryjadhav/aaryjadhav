<svg width="1200" height="24" viewBox="0 0 1200 24" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- © Aary Jadhav -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="11" width="1000" height="1.5" fill="#2a2a45"/>
  <rect x="-300" y="10" width="300" height="3" rx="1.5" fill="url(#g)">
    <animate attributeName="x" values="-300;1200" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="600" cy="12" r="4" fill="#a78bfa">
    <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>